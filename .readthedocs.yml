version: 2

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: false

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    install:
    - python -m pip install --upgrade --no-cache-dir pip
    - python -m pip install --upgrade --upgrade-strategy only-if-needed --no-cache-dir --group docs .
